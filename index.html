<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COMMAND</title>
<style>
  :root{--bg:#101218;--fg:#e8ecf4;--sub:#8a92a6;--dim:#3c4252;--accent:#5ad1ff;--ok:#7dffa0;--ng:#ff5a6a;--warn:#ffb648}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Segoe UI","Yu Gothic UI",system-ui,sans-serif;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #app{height:100%;max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;--tier-color:var(--accent)}
  /* コンボ倍率の段ごとの色（×1.5 / ×2 / ×2.5 / ×3）。演出はすべてこの色を使う */
  #app[data-tier="1"]{--tier-color:#5ad1ff}
  #app[data-tier="2"]{--tier-color:#7dffa0}
  #app[data-tier="3"]{--tier-color:#ffe24a}
  #app[data-tier="4"]{--tier-color:#ff6bd6}
  /* 高コンボの背景。コマンドの後ろに薄く敷くだけ（opacity は読みやすさを落とさない範囲） */
  #glow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle at 50% 50%,var(--tier-color),transparent 70%)}
  #app[data-tier="2"] #glow{opacity:.06}
  #app[data-tier="3"] #glow{opacity:.08}
  #app[data-tier="4"] #glow{opacity:.1}

  #hud{display:flex;gap:12px}
  .stat{flex:1;display:flex;flex-direction:column;align-items:center}
  .stat .k{font-size:12px;letter-spacing:.2em;color:var(--sub)}
  .stat .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
  #time.low{color:var(--warn)}
  .stat.timebox{position:relative}
  #time.boost{animation:boost .4s ease-out}
  @keyframes boost{0%{color:var(--ok);transform:scale(1.35)}100%{color:inherit;transform:scale(1)}}
  #time-plus{position:absolute;left:calc(50% + 38px);top:55%;font-size:16px;font-weight:700;color:var(--ok);opacity:0;pointer-events:none;white-space:nowrap}
  #time-plus.go{animation:plus .6s ease-out}
  @keyframes plus{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
  .stat.combobox{position:relative}
  #mult{position:absolute;left:calc(50% + 28px);top:58%;font-size:14px;font-weight:700;color:var(--tier-color);white-space:nowrap}
  #mult[hidden]{display:none}
  #mult.up{animation:multup .25s ease-out}
  @keyframes multup{from{transform:scale(1.6)}to{transform:scale(1)}}
  #score.bump{animation:bump .12s ease-out}
  @keyframes bump{from{transform:scale(1.15)}to{transform:scale(1)}}
  #combo.lose{animation:lose .3s ease-out}
  @keyframes lose{0%{color:var(--ng);text-shadow:0 0 12px var(--ng)}100%{color:inherit;text-shadow:none}}
  #gauge{height:6px;margin-top:8px;border-radius:3px;background:#1d2130;overflow:hidden}
  #gauge-fill{height:100%;width:0;border-radius:3px;background:var(--ok);transition:width .1s}

  #stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* 節目表示: 高さ固定なので出ても消えてもコマンドは動かない。浮かぶのは上方向だけ */
  #combo-pop{height:44px;line-height:44px;font-size:26px;font-weight:700;letter-spacing:.05em;white-space:nowrap;
    color:var(--tier-color);opacity:0;pointer-events:none}
  #combo-pop.big{font-size:32px;text-shadow:0 0 12px var(--tier-color),0 0 24px var(--tier-color)}
  #combo-pop.go{animation:combopop .6s ease-out}
  @keyframes combopop{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}
    70%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1)}}
  #cmd-wrap{position:relative;display:flex;justify-content:center;max-width:100%}
  /* クリア時の輪: コマンドの後ろで広がって消える。#cmd.scrollWidth に影響しないよう別 div */
  #ring{position:absolute;inset:-8px -24px;border:3px solid var(--tier-color);border-radius:999px;
    opacity:0;pointer-events:none;z-index:0}
  #ring.go{animation:ring .3s ease-out}
  @keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}
  #cmd{position:relative;z-index:1;display:flex;gap:.2em;font-size:var(--cmd-size,72px);font-weight:700;line-height:1.1}
  #cmd span{display:inline-block}
  #cmd span.done{color:var(--dim)}
  #cmd span.next{color:var(--accent);transform:scale(1.15)}
  #cmd span.hit{animation:hit .15s ease-out}
  #cmd span.miss{color:var(--ng);animation:shake .15s linear}
  #cmd.pop{animation:pop .12s ease-out}
  @keyframes hit{from{color:var(--ok);transform:scale(1.4)}to{color:var(--dim);transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0) scale(1.15)}25%{transform:translateX(-6px) scale(1.15)}75%{transform:translateX(6px) scale(1.15)}}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
  #msg{margin-top:20px;font-size:18px;color:var(--sub);text-align:center;min-height:1.5em}

  #pad{display:none;grid-template-areas:". u ." "l d r";grid-template-columns:repeat(3,1fr);gap:10px;
    width:min(100%,360px);margin:0 auto 8px}
  #pad button{height:72px;font-size:34px;font-weight:700;color:var(--fg);background:#1d2130;
    border:1px solid #2c3246;border-radius:14px;touch-action:none}
  #pad button:active{background:#2a3350}
  #pad .u{grid-area:u} #pad .l{grid-area:l} #pad .d{grid-area:d} #pad .r{grid-area:r}
  @media (pointer:coarse){#pad{display:grid}}

  #result{position:fixed;inset:0;background:rgba(16,18,24,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:16px}
  #result[hidden]{display:none}
  #result .title{font-size:22px;letter-spacing:.3em;color:var(--sub)}
  #result dl{display:grid;grid-template-columns:auto auto;gap:6px 28px;font-size:18px}
  #result dt{color:var(--sub);letter-spacing:.1em}
  #result dd{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  #result dd.big{font-size:40px}
  #retry{margin-top:8px;padding:16px 56px;font-size:28px;font-weight:700;letter-spacing:.15em;
    color:var(--bg);background:var(--accent);border:0;border-radius:14px;touch-action:none}
  #retry.locked{opacity:.35}
  #result .hint{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div id="app" data-tier="0">
  <div id="glow"></div>
  <div id="hud">
    <div class="stat"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
    <div class="stat timebox"><span class="k">TIME</span><span class="v" id="time">30.0</span><span id="time-plus">+3s</span></div>
    <div class="stat combobox"><span class="k">COMBO</span><span class="v" id="combo">0</span><span id="mult" hidden>×1.5</span></div>
  </div>
  <div id="gauge"><div id="gauge-fill"></div></div>
  <div id="stage">
    <div id="combo-pop"></div>
    <div id="cmd-wrap"><div id="ring"></div><div id="cmd"></div></div>
    <div id="msg"></div>
  </div>
  <div id="pad">
    <button class="u" data-dir="U">↑</button>
    <button class="l" data-dir="L">←</button>
    <button class="d" data-dir="D">↓</button>
    <button class="r" data-dir="R">→</button>
  </div>
</div>
<div id="result" hidden>
  <div class="title">RESULT</div>
  <dl>
    <dt>SCORE</dt><dd class="big" id="r-score">0</dd>
    <dt>ACCURACY</dt><dd id="r-acc">100%</dd>
    <dt>INPUTS</dt><dd id="r-inputs">0</dd>
    <dt>MISS</dt><dd id="r-miss">0</dd>
    <dt>MAX COMBO</dt><dd id="r-combo">0</dd>
    <dt>TIME BONUS</dt><dd id="r-bonus">+0s</dd>
  </dl>
  <button id="retry">RETRY</button>
  <div class="hint">Enter / Space</div>
</div>

<script>
// ===== COMMAND: ゲームロジック（DOM に触れない） =====
// 時刻は呼び出し側が now（ミリ秒）で渡す。乱数 rand は省略時 Math.random。

// 遊びながら調整する数値はすべてここ
const CFG = {
  TIME_LIMIT: 30000,   // 制限時間 ms
  LEN_START: 2,        // 最初のコマンドの長さ
  LEN_STEP: 3,         // 何コマンドクリアごとに1個長くなるか
  LEN_MAX: 9,          // 長さの上限
  PTS_PER_KEY: 100,    // 矢印1個あたりの基本点
  GAUGE_MAX: 10,       // 何コマンド連続クリアで満タンか
  GAUGE_BONUS: 3000,   // 満タンで増える時間 ms
  MISS_PENALTY: 50,    // ミス1回の減点
  RESULT_LOCK: 600,    // 結果表示から RETRY を受け付けるまで ms
  COMBO_STEP: 10,      // 何コンボごとに倍率が上がるか
  COMBO_RATE: 0.5,     // 1段あたり上がる倍率
  COMBO_MULT_MAX: 3,   // 倍率の上限
};

const DIRS = ['U', 'D', 'L', 'R'];

function commandLength(cleared) {
  return Math.min(CFG.LEN_START + Math.floor(cleared / CFG.LEN_STEP), CFG.LEN_MAX);
}

function makeCommand(len, rand) {
  rand = rand || Math.random;
  const cmd = [];
  for (let i = 0; i < len; i++) cmd.push(DIRS[Math.floor(rand() * DIRS.length)]);
  return cmd;
}

// クリア得点 = 矢印1個あたりの基本点 × 長さ
function clearScore(len) {
  return CFG.PTS_PER_KEY * len;
}

function comboMult(combo) {
  return Math.min(1 + CFG.COMBO_RATE * Math.floor(combo / CFG.COMBO_STEP), CFG.COMBO_MULT_MAX);
}

// 倍率の段（0 = ×1 … 上限で最大）。演出の色・音の切り替えに使う
function comboTier(combo) {
  return Math.round((comboMult(combo) - 1) / CFG.COMBO_RATE);
}

// コンボ表示を出す節目: 5 と COMBO_STEP の倍数
function isComboMilestone(combo) {
  return combo === 5 || (combo > 0 && combo % CFG.COMBO_STEP === 0);
}

function accuracy(s) {
  const total = s.inputs + s.misses;
  return total === 0 ? 100 : Math.floor(s.inputs * 100 / total);
}

function createState() {
  return {
    phase: 'ready',          // 'ready' | 'playing' | 'result'
    timeLeft: CFG.TIME_LIMIT,
    endAt: 0,
    resultAt: 0,
    score: 0,
    combo: 0,
    maxCombo: 0,
    cleared: 0,
    inputs: 0,
    misses: 0,
    command: [],
    pos: 0,
    gauge: 0,
    boosts: 0,               // 時間が増えた回数
  };
}

function nextCommand(s, now, rand) {
  s.command = makeCommand(commandLength(s.cleared), rand);
  s.pos = 0;
}

function startGame(s, now, rand) {
  Object.assign(s, createState());
  s.phase = 'playing';
  s.endAt = now + CFG.TIME_LIMIT;
  nextCommand(s, now, rand);
}

// 残り時間を更新する。時間切れになった瞬間だけ true
function tick(s, now) {
  if (s.phase !== 'playing') return false;
  s.timeLeft = Math.max(0, s.endAt - now);
  if (s.timeLeft > 0) return false;
  s.phase = 'result';
  s.resultAt = now;
  s.command = [];
  s.pos = 0;
  return true;
}

// 方向入力。戻り値: 'start' | 'hit' | 'clear' | 'boost' | 'miss' | 'end' | null
function press(s, dir, now, rand) {
  if (s.phase === 'ready') { startGame(s, now, rand); return 'start'; }
  if (s.phase !== 'playing') return null;
  if (tick(s, now)) return 'end';

  if (dir === s.command[s.pos]) {
    s.pos++;
    s.inputs++;
    if (s.pos < s.command.length) return 'hit';
    s.score += clearScore(s.command.length);
    s.cleared++;
    s.combo++;
    s.maxCombo = Math.max(s.maxCombo, s.combo);
    s.gauge++;
    let ev = 'clear';
    if (s.gauge >= CFG.GAUGE_MAX) {
      s.gauge = 0;
      s.endAt += CFG.GAUGE_BONUS;
      s.timeLeft = s.endAt - now;
      s.boosts++;
      ev = 'boost';
    }
    nextCommand(s, now, rand);   // 待ち時間ゼロで次へ
    return ev;
  }

  // ミス: 位置はそのまま、続けられる
  s.misses++;
  s.combo = 0;
  s.gauge = 0;
  s.score = Math.max(0, s.score - CFG.MISS_PENALTY);
  return 'miss';
}

function canRetry(s, now) {
  return s.phase === 'result' && now - s.resultAt >= CFG.RESULT_LOCK;
}

function retry(s, now, rand) {
  if (!canRetry(s, now)) return false;
  startGame(s, now, rand);
  return true;
}
// ===== 効果音（波形合成。ファイルなし） =====
const Snd = (() => {
  let ac = null;
  // 最初のユーザー入力で呼ぶ（自動再生制限のため）
  function unlock() {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      ac = new C();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(freq, dur, type, vol, when) {
    const a = unlock();
    if (!a) return;
    const t = a.currentTime + (when || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  return {
    unlock,
    // i: コマンド内の位置（0始まり）。打ち進むほど半音ずつ上がる
    hit(i)  { beep(880 * 2 ** ((i || 0) / 12), 0.05); },
    // tier: 倍率の段（0〜4）。上がるほど高く、和音が厚くなる
    clear(tier) {
      const t = tier || 0, base = 1320 * 2 ** (t / 6);
      beep(base, 0.08);
      if (t >= 1) beep(base * 1.25, 0.1, 'square', 0.04);
      if (t >= 2) beep(base * 1.5, 0.1, 'square', 0.04);
      if (t >= 3) beep(base * 2, 0.12, 'triangle', 0.06);
      if (t >= 4) beep(base * 2.5, 0.14, 'triangle', 0.06);
    },
    // 節目表示に合わせた明るい3音（クリア音のあとに続く）
    milestone() {
      beep(1047, 0.08, 'triangle', 0.09, 0.06);
      beep(1319, 0.08, 'triangle', 0.09, 0.12);
      beep(1568, 0.16, 'triangle', 0.09, 0.18);
    },
    tick()  { beep(1800, 0.03, 'square', 0.04); },
    boost() { beep(1320, 0.07, 'triangle', 0.1); beep(1760, 0.12, 'triangle', 0.1, 0.07); },
    miss()  { beep(140, 0.15, 'sawtooth', 0.08); },
    end()   {
      beep(660, 0.12, 'triangle', 0.12); beep(880, 0.12, 'triangle', 0.12, 0.12);
      beep(1100, 0.15, 'triangle', 0.12, 0.24); beep(1320, 0.4, 'triangle', 0.12, 0.38);
    },
  };
})();
// ===== 描画 =====
const ARROW = { U: '↑', D: '↓', L: '←', R: '→' };
const $ = id => document.getElementById(id);

function renderTime(s) {
  const t = $('time');
  t.textContent = (s.timeLeft / 1000).toFixed(1);
  t.classList.toggle('low', s.phase === 'playing' && s.timeLeft <= 10000);
}

// 最大サイズで実際に並べて幅を測り、はみ出す分だけ縮める
// （矢印の字幅はフォントで違うので、長さからの計算だと小さくなりすぎた）
const CMD_MAX = 120;
function fitCommand() {
  const cmd = $('cmd');
  const w = $('stage').clientWidth * 0.92; // 次の1個の scale(1.15) ぶんの余白
  cmd.style.setProperty('--cmd-size', CMD_MAX + 'px');
  const need = cmd.scrollWidth;
  if (need > w) cmd.style.setProperty('--cmd-size', Math.floor(CMD_MAX * w / need) + 'px');
}

function restartAnim(el, cls) {
  el.classList.remove(cls);
  void el.offsetWidth; // アニメーションを最初から再生させる
  el.classList.add(cls);
}

// 倍率の表示（×1.5 / ×2 …）
function multText(combo) { return '×' + comboMult(combo); }

// 数字を 0 から to まで ms かけて増やす。RESULT_LOCK（0.6秒）より短くすること
let countAnim = 0;
function countUp(el, to, ms) {
  cancelAnimationFrame(countAnim);
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(to * p).toLocaleString();
    if (p < 1) countAnim = requestAnimationFrame(step);
  };
  countAnim = requestAnimationFrame(step);
}
const COUNT_UP_MS = 500;

// 演出の「前回の状態」。段の上昇・スコア増加・コンボ切れの検出に使う
let prevTier = 0, prevCombo = 0;

// コンボ関連の演出（HUD・節目・輪・背景）
function renderCombo(s, ev) {
  const playing = s.phase === 'playing';
  const tier = playing ? comboTier(s.combo) : 0;
  $('app').dataset.tier = tier;   // --tier-color と背景の濃さが切り替わる

  const mult = $('mult');
  mult.hidden = tier === 0;
  if (tier > 0) mult.textContent = multText(s.combo);
  if (tier > prevTier) restartAnim(mult, 'up');

  if (ev === 'miss' && prevCombo >= 2) restartAnim($('combo'), 'lose');

  const pop = $('combo-pop');
  if (ev === 'clear' || ev === 'boost') {
    restartAnim($('ring'), 'go');
    restartAnim($('score'), 'bump');
    if (isComboMilestone(s.combo)) {
      pop.textContent = s.combo + ' COMBO!';
      pop.classList.toggle('big', s.combo >= 30);
      restartAnim(pop, 'go');
    }
  } else if (ev === 'miss' || ev === 'start' || ev === 'end') {
    pop.classList.remove('go');
  }

  prevTier = tier;
  prevCombo = playing ? s.combo : 0;
}

// ev: press() の戻り値、または 'end' / null
function render(s, ev) {
  $('score').textContent = s.score.toLocaleString();
  $('combo').textContent = s.combo;
  renderTime(s);
  renderCombo(s, ev);
  $('gauge-fill').style.width = (s.gauge / CFG.GAUGE_MAX * 100) + '%';

  const cmd = $('cmd');
  const msg = $('msg');
  if (s.phase === 'playing') {
    cmd.replaceChildren(...s.command.map((d, i) => {
      const sp = document.createElement('span');
      sp.textContent = ARROW[d];
      if (i < s.pos) sp.className = 'done';
      else if (i === s.pos) sp.className = 'next';
      return sp;
    }));
    if (ev === 'hit') cmd.children[s.pos - 1].classList.add('hit');
    if (ev === 'miss') cmd.children[s.pos].classList.add('miss');
    if (ev === 'clear' || ev === 'boost' || ev === 'start') restartAnim(cmd, 'pop');
    if (ev === 'boost') {
      restartAnim($('time'), 'boost');
      $('time-plus').textContent = '+' + CFG.GAUGE_BONUS / 1000 + 's';
      restartAnim($('time-plus'), 'go');
    }
    fitCommand();
    msg.textContent = '';
  } else if (s.phase === 'ready') {
    cmd.replaceChildren();
    msg.textContent = '表示された矢印を順に入力 ／ 矢印キーかボタンでスタート';
  } else {
    cmd.replaceChildren();
    msg.textContent = '';
  }

  if (s.phase !== 'result') cancelAnimationFrame(countAnim);
  $('result').hidden = s.phase !== 'result';
  if (s.phase === 'result') {
    if (ev === 'end') countUp($('r-score'), s.score, COUNT_UP_MS);
    else $('r-score').textContent = s.score.toLocaleString();
    $('r-acc').textContent = accuracy(s) + '%';
    $('r-inputs').textContent = s.inputs;
    $('r-miss').textContent = s.misses;
    $('r-combo').textContent = s.maxCombo + '  (×' + s.maxMult + ')';
    $('r-bonus').textContent = '+' + (s.boosts * CFG.GAUGE_BONUS / 1000) + 's';
  }
}
// ===== 入力（キーボードとタッチを onDir / onRetry に集約） =====
// e.code で判定する（日本語入力ON でも WASD が効くように）
const KEYMAP = {
  ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R',
  KeyW: 'U', KeyS: 'D', KeyA: 'L', KeyD: 'R',
};

function bindInput(onDir, onRetry) {
  window.addEventListener('keydown', e => {
    if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') {
      e.preventDefault();
      if (!e.repeat) onRetry();
      return;
    }
    const dir = KEYMAP[e.code];
    if (!dir) return;
    e.preventDefault();          // 矢印キーでページがスクロールしないように
    if (e.repeat) return;        // 押しっぱなしは無視
    onDir(dir);
  });

  // pointerdown で即反応（click の遅延を避ける）
  document.querySelectorAll('#pad button').forEach(b => {
    b.addEventListener('pointerdown', e => { e.preventDefault(); onDir(b.dataset.dir); });
  });
  $('retry').addEventListener('pointerdown', e => { e.preventDefault(); onRetry(); });
  window.addEventListener('contextmenu', e => e.preventDefault()); // 長押しメニューを出さない
}
// ===== 起動とループ =====
const S = createState();

// 残り5〜1秒の各秒の切り替わりで tick を鳴らす。
// 時間延長で秒数が増えたときは基準だけ更新し、鳴らさない（二重に鳴らさない）
let lastSec = Infinity;
function tickSound() {
  if (S.phase !== 'playing') { lastSec = Infinity; return; }
  const sec = Math.ceil(S.timeLeft / 1000);
  if (sec < lastSec && sec >= 1 && sec <= 5) Snd.tick();
  lastSec = sec;
}

function onDir(dir) {
  Snd.unlock();
  const ev = press(S, dir, performance.now());
  if (ev === 'start') lastSec = Infinity;
  else if (ev === 'hit') Snd.hit(S.pos - 1);
  else if (ev === 'clear') {
    Snd.clear(comboTier(S.combo));
    if (isComboMilestone(S.combo)) Snd.milestone();   // boost と同時のときは boost だけ
  }
  else if (ev === 'boost') Snd.boost();
  else if (ev === 'miss') Snd.miss();
  else if (ev === 'end') Snd.end();
  if (ev) render(S, ev);
}

function onRetry() {
  Snd.unlock();
  if (retry(S, performance.now())) { lastSec = Infinity; render(S, 'start'); }
}

function loop() {
  const now = performance.now();
  if (tick(S, now)) { Snd.end(); render(S, 'end'); }
  else if (S.phase === 'playing') { renderTime(S); tickSound(); }
  if (S.phase === 'result') $('retry').classList.toggle('locked', !canRetry(S, now));
  requestAnimationFrame(loop);
}

bindInput(onDir, onRetry);
window.addEventListener('resize', () => { if (S.phase === 'playing') fitCommand(); });
render(S, null);
requestAnimationFrame(loop);
</script>
</body>
</html>
