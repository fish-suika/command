<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>COMMAND</title>
<style>
  :root{--bg:#101218;--fg:#e8ecf4;--sub:#8a92a6;--dim:#3c4252;--accent:#5ad1ff;--ok:#7dffa0;--ng:#ff5a6a;--warn:#ffb648}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Segoe UI","Yu Gothic UI",system-ui,sans-serif;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #app{height:100%;max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;--tier-color:var(--accent)}
  /* コンボ倍率の段ごとの色（×1.5 / ×2 / ×2.5 / ×3）。演出はすべてこの色を使う */
  #app[data-tier="1"]{--tier-color:#5ad1ff}
  #app[data-tier="2"]{--tier-color:#7dffa0}
  #app[data-tier="3"]{--tier-color:#ffe24a}
  #app[data-tier="4"]{--tier-color:#ff6bd6}
  /* 高コンボの背景。コマンドの後ろに薄く敷くだけ（opacity は読みやすさを落とさない範囲） */
  #glow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .3s;
    background:radial-gradient(circle at 50% 50%,var(--tier-color),transparent 70%)}
  #app[data-tier="2"] #glow{opacity:.06}
  #app[data-tier="3"] #glow{opacity:.08}
  #app[data-tier="4"] #glow{opacity:.1}

  #hud{display:flex;gap:12px}
  .stat{flex:1;display:flex;flex-direction:column;align-items:center}
  .stat .k{font-size:12px;letter-spacing:.2em;color:var(--sub)}
  .stat .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
  #time.low{color:var(--warn)}
  .stat.timebox{position:relative}
  #time.boost{animation:boost .4s ease-out}
  @keyframes boost{0%{color:var(--ok);transform:scale(1.35)}100%{color:inherit;transform:scale(1)}}
  #time-plus{position:absolute;left:calc(50% + 38px);top:55%;font-size:16px;font-weight:700;color:var(--ok);opacity:0;pointer-events:none;white-space:nowrap}
  #time-plus.go{animation:plus .6s ease-out}
  @keyframes plus{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-18px)}}
  .stat.combobox{position:relative}
  #mult{position:absolute;left:calc(50% + 28px);top:58%;font-size:14px;font-weight:700;color:var(--tier-color);white-space:nowrap}
  #mult[hidden]{display:none}
  #mult.up{animation:multup .25s ease-out}
  @keyframes multup{from{transform:scale(1.6)}to{transform:scale(1)}}
  #score.bump{animation:bump .12s ease-out}
  @keyframes bump{from{transform:scale(1.15)}to{transform:scale(1)}}
  #combo.lose{animation:lose .3s ease-out}
  @keyframes lose{0%{color:var(--ng);text-shadow:0 0 12px var(--ng)}100%{color:inherit;text-shadow:none}}
  #gauge{height:6px;margin-top:8px;border-radius:3px;background:#1d2130;overflow:hidden}
  #gauge-fill{height:100%;width:0;border-radius:3px;background:var(--ok);transition:width .1s}

  #stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  /* 節目表示: 高さ固定なので出ても消えてもコマンドは動かない。浮かぶのは上方向だけ */
  #combo-pop{height:44px;line-height:44px;font-size:26px;font-weight:700;letter-spacing:.05em;white-space:nowrap;
    color:var(--tier-color);opacity:0;pointer-events:none}
  #combo-pop.big{font-size:32px;text-shadow:0 0 12px var(--tier-color),0 0 24px var(--tier-color)}
  #combo-pop.go{animation:combopop .6s ease-out}
  @keyframes combopop{0%{opacity:0;transform:translateY(8px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}
    70%{opacity:1}100%{opacity:0;transform:translateY(-28px) scale(1)}}
  #cmd-wrap{position:relative;display:flex;justify-content:center;max-width:100%}
  /* クリア時の輪: コマンドの後ろで広がって消える。#cmd.scrollWidth に影響しないよう別 div */
  #ring{position:absolute;inset:-8px -24px;border:3px solid var(--tier-color);border-radius:999px;
    opacity:0;pointer-events:none;z-index:0}
  #ring.go{animation:ring .3s ease-out}
  @keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.4)}}
  #cmd{position:relative;z-index:1;display:flex;gap:.2em;font-size:var(--cmd-size,72px);font-weight:700;line-height:1.1}
  #cmd span{display:inline-block}
  #cmd span.done{color:var(--dim)}
  #cmd span.next{color:var(--accent);transform:scale(1.15)}
  #cmd span.hit{animation:hit .15s ease-out}
  #cmd span.miss{color:var(--ng);animation:shake .15s linear}
  #cmd.pop{animation:pop .12s ease-out}
  @keyframes hit{from{color:var(--ok);transform:scale(1.4)}to{color:var(--dim);transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0) scale(1.15)}25%{transform:translateX(-6px) scale(1.15)}75%{transform:translateX(6px) scale(1.15)}}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
  #msg{margin-top:20px;font-size:18px;color:var(--sub);text-align:center;min-height:1.5em}

  #pad{display:none;grid-template-areas:". u ." "l d r";grid-template-columns:repeat(3,1fr);gap:10px;
    width:min(100%,360px);margin:0 auto 8px}
  #pad button{height:72px;font-size:34px;font-weight:700;color:var(--fg);background:#1d2130;
    border:1px solid #2c3246;border-radius:14px;touch-action:none}
  #pad button:active{background:#2a3350}
  #pad .u{grid-area:u} #pad .l{grid-area:l} #pad .d{grid-area:d} #pad .r{grid-area:r}
  @media (pointer:coarse){#pad{display:grid}}

  #result{position:fixed;inset:0;background:rgba(16,18,24,.94);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:16px}
  #result[hidden]{display:none}
  #result .title{font-size:22px;letter-spacing:.3em;color:var(--sub)}
  #result dl{display:grid;grid-template-columns:auto auto;gap:6px 28px;font-size:18px}
  #result dt{color:var(--sub);letter-spacing:.1em}
  #result dd{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  #result dd.big{font-size:40px}
  #retry{margin-top:8px;padding:16px 56px;font-size:28px;font-weight:700;letter-spacing:.15em;
    color:var(--bg);background:var(--accent);border:0;border-radius:14px;touch-action:none}
  #retry.locked{opacity:.35}
  #result .hint{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div id="app" data-tier="0">
  <div id="glow"></div>
  <div id="hud">
    <div class="stat"><span class="k">SCORE</span><span class="v" id="score">0</span></div>
    <div class="stat timebox"><span class="k">TIME</span><span class="v" id="time">30.0</span><span id="time-plus">+3s</span></div>
    <div class="stat combobox"><span class="k">COMBO</span><span class="v" id="combo">0</span><span id="mult" hidden>×1.5</span></div>
  </div>
  <div id="gauge"><div id="gauge-fill"></div></div>
  <div id="stage">
    <div id="combo-pop"></div>
    <div id="cmd-wrap"><div id="ring"></div><div id="cmd"></div></div>
    <div id="msg"></div>
  </div>
  <div id="pad">
    <button class="u" data-dir="U">↑</button>
    <button class="l" data-dir="L">←</button>
    <button class="d" data-dir="D">↓</button>
    <button class="r" data-dir="R">→</button>
  </div>
</div>
<div id="result" hidden>
  <div class="title">RESULT</div>
  <dl>
    <dt>SCORE</dt><dd class="big" id="r-score">0</dd>
    <dt>ACCURACY</dt><dd id="r-acc">100%</dd>
    <dt>INPUTS</dt><dd id="r-inputs">0</dd>
    <dt>MISS</dt><dd id="r-miss">0</dd>
    <dt>MAX COMBO</dt><dd id="r-combo">0</dd>
    <dt>TIME BONUS</dt><dd id="r-bonus">+0s</dd>
  </dl>
  <button id="retry">RETRY</button>
  <div class="hint">Enter / Space</div>
</div>

<script>
