<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>検証 — COMMAND</title>
<style>
  body{font-family:"Yu Gothic UI",system-ui,sans-serif;background:#1c1c1e;color:#eee;padding:24px;line-height:1.7}
  h1{font-size:18px;margin-bottom:16px}
  .r{padding:4px 0;border-bottom:1px solid #333}
  .ok::before{content:"PASS ";color:#6bd07a;font-weight:bold}
  .ng::before{content:"FAIL ";color:#ff6b6b;font-weight:bold}
  .ng{color:#ffb0b0}
  .why{color:#ff8f8f;padding-left:3em;font-size:13px}
  #sum{margin-top:18px;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<h1>COMMAND — 検証</h1>
<div id="out"></div>
<div id="sum"></div>

<script>
// ===== COMMAND: ゲームロジック（DOM に触れない） =====
// 時刻は呼び出し側が now（ミリ秒）で渡す。乱数 rand は省略時 Math.random。

// 遊びながら調整する数値はすべてここ
const CFG = {
  TIME_LIMIT: 30000,   // 制限時間 ms
  LEN_START: 2,        // 最初のコマンドの長さ
  LEN_STEP: 3,         // 何コマンドクリアごとに1個長くなるか
  LEN_MAX: 9,          // 長さの上限
  PTS_PER_KEY: 100,    // 矢印1個あたりの基本点
  GAUGE_MAX: 10,       // 何コマンド連続クリアで満タンか
  GAUGE_BONUS: 3000,   // 満タンで増える時間 ms
  MISS_PENALTY: 50,    // ミス1回の減点
  RESULT_LOCK: 600,    // 結果表示から RETRY を受け付けるまで ms
  COMBO_STEP: 10,      // 何コンボごとに倍率が上がるか
  COMBO_RATE: 0.5,     // 1段あたり上がる倍率
  COMBO_MULT_MAX: 3,   // 倍率の上限
};

const DIRS = ['U', 'D', 'L', 'R'];

function commandLength(cleared) {
  return Math.min(CFG.LEN_START + Math.floor(cleared / CFG.LEN_STEP), CFG.LEN_MAX);
}

function makeCommand(len, rand) {
  rand = rand || Math.random;
  const cmd = [];
  for (let i = 0; i < len; i++) cmd.push(DIRS[Math.floor(rand() * DIRS.length)]);
  return cmd;
}

// クリア得点 = 矢印1個あたりの基本点 × 長さ
function clearScore(len) {
  return CFG.PTS_PER_KEY * len;
}

function comboMult(combo) {
  return Math.min(1 + CFG.COMBO_RATE * Math.floor(combo / CFG.COMBO_STEP), CFG.COMBO_MULT_MAX);
}

// 倍率の段（0 = ×1 … 上限で最大）。演出の色・音の切り替えに使う
function comboTier(combo) {
  return Math.round((comboMult(combo) - 1) / CFG.COMBO_RATE);
}

// コンボ表示を出す節目: 5 と COMBO_STEP の倍数
function isComboMilestone(combo) {
  return combo === 5 || (combo > 0 && combo % CFG.COMBO_STEP === 0);
}

function accuracy(s) {
  const total = s.inputs + s.misses;
  return total === 0 ? 100 : Math.floor(s.inputs * 100 / total);
}

function createState() {
  return {
    phase: 'ready',          // 'ready' | 'playing' | 'result'
    timeLeft: CFG.TIME_LIMIT,
    endAt: 0,
    resultAt: 0,
    score: 0,
    combo: 0,
    maxCombo: 0,
    maxMult: 1,              // 到達した最大倍率
    cleared: 0,
    inputs: 0,
    misses: 0,
    command: [],
    pos: 0,
    gauge: 0,
    boosts: 0,               // 時間が増えた回数
  };
}

function nextCommand(s, now, rand) {
  s.command = makeCommand(commandLength(s.cleared), rand);
  s.pos = 0;
}

function startGame(s, now, rand) {
  Object.assign(s, createState());
  s.phase = 'playing';
  s.endAt = now + CFG.TIME_LIMIT;
  nextCommand(s, now, rand);
}

// 残り時間を更新する。時間切れになった瞬間だけ true
function tick(s, now) {
  if (s.phase !== 'playing') return false;
  s.timeLeft = Math.max(0, s.endAt - now);
  if (s.timeLeft > 0) return false;
  s.phase = 'result';
  s.resultAt = now;
  s.command = [];
  s.pos = 0;
  return true;
}

// 方向入力。戻り値: 'start' | 'hit' | 'clear' | 'boost' | 'miss' | 'end' | null
function press(s, dir, now, rand) {
  if (s.phase === 'ready') { startGame(s, now, rand); return 'start'; }
  if (s.phase !== 'playing') return null;
  if (tick(s, now)) return 'end';

  if (dir === s.command[s.pos]) {
    s.pos++;
    s.inputs++;
    if (s.pos < s.command.length) return 'hit';
    s.cleared++;
    s.combo++;
    s.maxCombo = Math.max(s.maxCombo, s.combo);
    s.maxMult = Math.max(s.maxMult, comboMult(s.combo));
    s.score += Math.round(clearScore(s.command.length) * comboMult(s.combo));
    s.gauge++;
    let ev = 'clear';
    if (s.gauge >= CFG.GAUGE_MAX) {
      s.gauge = 0;
      s.endAt += CFG.GAUGE_BONUS;
      s.timeLeft = s.endAt - now;
      s.boosts++;
      ev = 'boost';
    }
    nextCommand(s, now, rand);   // 待ち時間ゼロで次へ
    return ev;
  }

  // ミス: 位置はそのまま、続けられる
  s.misses++;
  s.combo = 0;
  s.gauge = 0;
  s.score = Math.max(0, s.score - CFG.MISS_PENALTY);
  return 'miss';
}

function canRetry(s, now) {
  return s.phase === 'result' && now - s.resultAt >= CFG.RESULT_LOCK;
}

function retry(s, now, rand) {
  if (!canRetry(s, now)) return false;
  startGame(s, now, rand);
  return true;
}

// 自己ベストとの比較。best は保存済みのベスト（無ければ 0）
function judgeBest(score, best) {
  const isNew = score > best;
  return { isNew, best: isNew ? score : best, diff: isNew ? 0 : best - score };
}
// ===== 検証ハーネス =====
const __results = [];
function test(name, fn) {
  try { fn(); __results.push({ name, ok: true }); }
  catch (e) { __results.push({ name, ok: false, why: e.message }); }
}
function eq(actual, expected, label) {
  const a = JSON.stringify(actual), b = JSON.stringify(expected);
  if (a !== b) throw new Error((label ? label + ': ' : '') + 'expected ' + b + ' but got ' + a);
}
// 渡した値を順に返す乱数（末尾まで行ったら先頭に戻る）
function seqRand(vals) { let i = 0; return () => vals[i++ % vals.length]; }
const R0 = seqRand([0]); // 常に 'U' を出す

// ===== テスト =====
test('commandLength: クリア数に応じて伸び、上限で止まる', () => {
  const L = CFG.LEN_START, N = CFG.LEN_STEP, M = CFG.LEN_MAX;
  eq(commandLength(0), L, '0');
  eq(commandLength(N - 1), L, 'STEP-1');
  eq(commandLength(N), L + 1, 'STEP');
  eq(commandLength(N * (M - L) - 1), M - 1, '上限の直前');
  eq(commandLength(N * (M - L)), M, '上限');
  eq(commandLength(1000), M, '上限で止まる');
});

test('makeCommand: 乱数を固定すると決まった並びになる', () => {
  eq(makeCommand(4, seqRand([0, 0.25, 0.5, 0.75])), ['U', 'D', 'L', 'R']);
  eq(makeCommand(3, seqRand([0.99])), ['R', 'R', 'R']);
});

test('clearScore: 矢印1個あたりの基本点×長さ', () => {
  eq(clearScore(2), 200); eq(clearScore(9), 900);
});

test('accuracy: 0除算を含む', () => {
  const s = createState();
  eq(accuracy(s), 100, '0/0');
  s.inputs = 97; s.misses = 3; eq(accuracy(s), 97, '97/100');
  s.inputs = 2; s.misses = 1; eq(accuracy(s), 66, '2/3 は切り捨て');
});

test('ready で方向を押すと開始し、その入力は数えない', () => {
  const s = createState();
  eq(s.phase, 'ready');
  eq(press(s, 'L', 1000, R0), 'start');
  eq(s.phase, 'playing');
  eq(s.command, ['U', 'U']);
  eq(s.pos, 0); eq(s.inputs, 0); eq(s.misses, 0);
  eq(s.endAt, 1000 + CFG.TIME_LIMIT);
});

test('正解キーで pos と inputs が進む', () => {
  const s = createState(); press(s, 'U', 0, R0);
  eq(press(s, 'U', 100, R0), 'hit');
  eq(s.pos, 1); eq(s.inputs, 1);
});

test('ミスしても pos は動かず、スコアは0未満にならない', () => {
  const s = createState(); press(s, 'U', 0, R0);
  press(s, 'U', 100, R0);
  eq(press(s, 'D', 200, R0), 'miss');
  eq(s.pos, 1); eq(s.misses, 1); eq(s.combo, 0); eq(s.score, 0);
});

test('最後まで入力するとクリアし、同じ処理で次のコマンドが出る', () => {
  const s = createState(); press(s, 'U', 0, R0);
  press(s, 'U', 100, R0);
  eq(press(s, 'U', 200, R0), 'clear');
  eq(s.cleared, 1); eq(s.combo, 1); eq(s.maxCombo, 1);
  eq(s.score, 200); eq(s.gauge, 1);
  eq(s.command, ['U', 'U']); eq(s.pos, 0);
});

test('ミスでスコアが MISS_PENALTY 減り、コンボが切れる', () => {
  const s = createState(); press(s, 'U', 0, R0);
  press(s, 'U', 100, R0); press(s, 'U', 200, R0); // クリア
  const before = s.score;
  eq(press(s, 'L', 300, R0), 'miss');
  eq(s.score, before - CFG.MISS_PENALTY);
  eq(s.combo, 0); eq(s.maxCombo, 1);
  eq(s.gauge, 0);
});

test('LEN_STEP 回クリアするとコマンドが1個伸びる', () => {
  const s = createState(); press(s, 'U', 0, R0);
  let t = 0;
  for (let c = 0; c < CFG.LEN_STEP; c++) { while (true) { t += 10; const ev = press(s, 'U', t, R0); if (ev === 'clear' || ev === 'boost') break; } }
  eq(s.cleared, CFG.LEN_STEP); eq(s.command.length, CFG.LEN_START + 1);
});

// 1コマンド分（長さに関わらず 'U' を押し続ける）を入力して最後の戻り値を返す
function clearOne(s, tRef) {
  while (true) { tRef.t += 10; const ev = press(s, 'U', tRef.t, R0); if (ev !== 'hit') return ev; }
}

test('10回連続クリアで時間が GAUGE_BONUS 増え、ゲージが空になる', () => {
  const s = createState(); press(s, 'U', 0, R0);
  const T = { t: 0 };
  for (let i = 0; i < 9; i++) eq(clearOne(s, T), 'clear', String(i));
  eq(s.gauge, 9); eq(s.endAt, CFG.TIME_LIMIT); eq(s.boosts, 0);
  eq(clearOne(s, T), 'boost');
  eq(s.gauge, 0); eq(s.boosts, 1); eq(s.endAt, CFG.TIME_LIMIT + CFG.GAUGE_BONUS);
});

test('ミスするとゲージが0に戻り、満タンまでやり直し', () => {
  const s = createState(); press(s, 'U', 0, R0);
  const T = { t: 0 };
  for (let i = 0; i < 5; i++) clearOne(s, T);
  eq(s.gauge, 5);
  eq(press(s, 'D', T.t + 10, R0), 'miss'); T.t += 10;
  eq(s.gauge, 0);
  for (let i = 0; i < 9; i++) eq(clearOne(s, T), 'clear', String(i));
  eq(s.boosts, 0);
  eq(clearOne(s, T), 'boost');
  eq(s.boosts, 1);
});

test('延長した分だけ時間切れが遅れる', () => {
  const s = createState(); press(s, 'U', 0, R0);
  const T = { t: 0 };
  for (let i = 0; i < 10; i++) clearOne(s, T);
  eq(s.boosts, 1);
  eq(tick(s, CFG.TIME_LIMIT), false); eq(s.phase, 'playing');
  eq(tick(s, CFG.TIME_LIMIT + CFG.GAUGE_BONUS), true);
});

test('時間切れ後の入力は数えずに result へ移る', () => {
  const s = createState(); press(s, 'U', 0, R0);
  eq(press(s, 'U', CFG.TIME_LIMIT, R0), 'end');
  eq(s.phase, 'result'); eq(s.inputs, 0); eq(s.resultAt, CFG.TIME_LIMIT);
  eq(s.command, []);
  eq(press(s, 'U', CFG.TIME_LIMIT + 10, R0), null, 'result 中の方向キーは無視');
});

test('tick は時間切れの瞬間に1度だけ true を返す', () => {
  const s = createState(); press(s, 'U', 0, R0);
  eq(tick(s, CFG.TIME_LIMIT / 2), false); eq(s.timeLeft, CFG.TIME_LIMIT / 2);
  eq(tick(s, CFG.TIME_LIMIT + 5), true); eq(s.timeLeft, 0);
  eq(tick(s, CFG.TIME_LIMIT + 50), false);
});

test('RETRY は結果表示から RESULT_LOCK 経つまで効かない', () => {
  const s = createState(); press(s, 'U', 0, R0);
  press(s, 'D', 100, R0); // ミス1
  tick(s, CFG.TIME_LIMIT);
  eq(canRetry(s, CFG.TIME_LIMIT + CFG.RESULT_LOCK - 1), false);
  eq(retry(s, CFG.TIME_LIMIT + CFG.RESULT_LOCK - 1, R0), false);
  eq(s.phase, 'result');
  const t = CFG.TIME_LIMIT + CFG.RESULT_LOCK;
  eq(retry(s, t, R0), true);
  eq(s.phase, 'playing'); eq(s.misses, 0); eq(s.score, 0);
  eq(s.gauge, 0); eq(s.boosts, 0);
  eq(s.endAt, t + CFG.TIME_LIMIT); eq(s.command.length, 2);
});

test('playing 中・ready 中は RETRY が効かない', () => {
  const s = createState();
  eq(retry(s, 99999, R0), false);
  press(s, 'U', 0, R0);
  eq(retry(s, 99999, R0), false);
});

test('comboMult: COMBO_STEP ごとに COMBO_RATE ずつ上がり、上限で止まる', () => {
  const N = CFG.COMBO_STEP, r = CFG.COMBO_RATE, M = CFG.COMBO_MULT_MAX;
  eq(comboMult(0), 1, '0');
  eq(comboMult(N - 1), 1, 'STEP-1');
  eq(comboMult(N), 1 + r, 'STEP');
  eq(comboMult(N * 2), 1 + r * 2, 'STEP*2');
  eq(comboMult(N * 1000), M, '上限');
});

test('comboTier: 倍率の段（0 から上限の段まで）', () => {
  const N = CFG.COMBO_STEP, r = CFG.COMBO_RATE, M = CFG.COMBO_MULT_MAX;
  eq(comboTier(0), 0, '0');
  eq(comboTier(N), 1, 'STEP');
  eq(comboTier(N * 2), 2, 'STEP*2');
  eq(comboTier(N * 1000), Math.round((M - 1) / r), '上限');
});

test('isComboMilestone: 5 と COMBO_STEP の倍数だけ', () => {
  const N = CFG.COMBO_STEP;
  eq(isComboMilestone(0), false, '0');
  eq(isComboMilestone(4), false, '4');
  eq(isComboMilestone(5), true, '5');
  eq(isComboMilestone(N), true, 'STEP');
  eq(isComboMilestone(N + 1), false, 'STEP+1');
  eq(isComboMilestone(N * 3), true, 'STEP*3');
});

test('クリア時の得点にクリア後のコンボの倍率がかかる', () => {
  const s = createState(); press(s, 'U', 0, R0);
  const T = { t: 0 };
  for (let c = 0; c < CFG.COMBO_STEP - 1; c++) clearOne(s, T);
  const len = s.command.length, before = s.score;
  clearOne(s, T);
  eq(s.combo, CFG.COMBO_STEP);
  eq(s.score - before, Math.round(clearScore(len) * comboMult(CFG.COMBO_STEP)));
  eq(s.maxMult, comboMult(CFG.COMBO_STEP), 'maxMult');
});

test('ミスすると倍率が ×1 に戻る（到達した最大倍率は残る）', () => {
  const s = createState(); press(s, 'U', 0, R0);
  const T = { t: 0 };
  for (let c = 0; c < CFG.COMBO_STEP; c++) clearOne(s, T);
  eq(press(s, 'D', T.t += 10, R0), 'miss');
  const len = s.command.length, before = s.score;
  clearOne(s, T);
  eq(s.score - before, clearScore(len));
  eq(s.maxMult, comboMult(CFG.COMBO_STEP), 'maxMult は戻らない');
});

test('judgeBest: 初プレイ（best 0）は更新扱いで best が score になる', () => {
  const r = judgeBest(500, 0);
  eq(r.isNew, true, 'isNew'); eq(r.best, 500, 'best'); eq(r.diff, 0, 'diff');
});

test('judgeBest: 自己ベストを超えたら更新', () => {
  const r = judgeBest(1300, 1200);
  eq(r.isNew, true, 'isNew'); eq(r.best, 1300, 'best'); eq(r.diff, 0, 'diff');
});

test('judgeBest: 同点は更新ではない（diff 0）', () => {
  const r = judgeBest(1200, 1200);
  eq(r.isNew, false, 'isNew'); eq(r.best, 1200, 'best'); eq(r.diff, 0, 'diff');
});

test('judgeBest: 下回ると差が出て best は変わらない', () => {
  const r = judgeBest(900, 1200);
  eq(r.isNew, false, 'isNew'); eq(r.best, 1200, 'best'); eq(r.diff, 300, 'diff');
});

test('judgeBest: score 0 かつ best 0 は更新ではない', () => {
  const r = judgeBest(0, 0);
  eq(r.isNew, false, 'isNew'); eq(r.best, 0, 'best'); eq(r.diff, 0, 'diff');
});

// ===== 結果表示 =====
(function () {
  const out = document.getElementById('out');
  let pass = 0;
  for (const r of __results) {
    const d = document.createElement('div');
    d.className = 'r ' + (r.ok ? 'ok' : 'ng');
    d.textContent = r.name;
    out.appendChild(d);
    if (r.ok) pass++;
    else { const w = document.createElement('div'); w.className = 'why'; w.textContent = r.why; out.appendChild(w); }
  }
  const sum = pass + '/' + __results.length;
  document.getElementById('sum').textContent = (pass === __results.length ? 'すべて通過 ' : '失敗あり ') + sum;
  document.title = (pass === __results.length ? 'PASS ' : 'FAIL ') + sum;
})();
</script>
</body>
</html>
